<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>432Hz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="layout">
      <div class="panel-image" aria-hidden="true"></div>

      <main class="panel-content">
        <header class="site-header">
          <p id="js-eyebrow" class="eyebrow"><b>432hz tuner</b></p>
          <h1>Convierte música a<br />su frecuencia natural.</h1>
        </header>

        <section class="form-section">
          <form id="job-form">
            <div id="drop-zone" class="drop-zone" tabindex="0" role="button" aria-label="Seleccionar archivo de audio">
              <input id="audio-file" name="audio" type="file" accept=".aac,.flac,.m4a,.mp3,.ogg,.opus,.wav,.webm,audio/*" hidden />
              <strong>Arrastra tu archivo de audio aquí</strong>
              <span>o haz clic para seleccionarlo</span>
              <span id="file-name" class="file-name">MP3, WAV, M4A, FLAC, OGG o AAC · máximo 250 MB</span>
            </div>
             <div class="select-row">
              <label id="tuning-mode-label">Perfil de afinación</label>
              <div class="tuning-buttons" role="radiogroup" aria-labelledby="tuning-mode-label">
                <button type="button" class="tuning-btn" data-value="original" aria-pressed="false">Sin transformación - 440 Hz</button>
                <button type="button" class="tuning-btn" data-value="exact" aria-pressed="true">Exacto - 432 Hz</button>
              </div>
              <input id="tuning-mode" name="tuningMode" type="hidden" value="exact" />
            </div>
            <div class="input-row">
              <button type="submit">Convertir</button>
            </div>
      
          </form>
          <p id="form-error" class="error hidden"></p>
        </section>

        <section id="job-panel" class="job-panel hidden">
          <p id="job-status" class="job-status"></p>
          <p id="job-tuning" class="job-meta"></p>
          <p id="job-duration" class="job-meta"></p>
          <p id="job-error" class="error"></p>
          <div id="downloads" class="downloads"></div>
        </section>

      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
